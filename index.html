<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2D6A4F">
<meta name="description" content="Foyer à deux : tâches, courses, menus, budget, agenda et projets du couple, et Ma Maison pour la domotique.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Foyer à deux">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<title>Foyer à deux</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Inter:wght@400;500;600&display=swap">
</head>
<body>
<style>
/* Layout: app shell — sidebar on desktop, bottom tab bar on phones; each section is a working list with an add form on top.
   The two partners each own a colour (A = bleu, B = ambre); "ensemble" uses the green accent. */
:root{
  --bg:#F3F5EF; --surface:#FFFFFF; --surface-2:#E9ECE3; --fg:#1B231F; --muted:#5C675F; --line:#D8DDD2;
  --accent:#2D6A4F; --accent-fg:#FFFFFF; --accent-soft:#DAEADF;
  --pa:#3D5FD9; --pa-soft:#E2E8FC; --pb:#B8641A; --pb-soft:#F7E5D2;
  --danger:#B42318; --danger-soft:#FBE3E0; --late:#B42318;
  --font-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --font-body:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:12px; --r-sm:8px;
  /* Ma Maison: warm lamp light, cool air */
  --lamp:#C9780F; --lamp-soft:#FBEBD0; --cool:#2B78AE; --cool-soft:#DDEBF5;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#101412; --surface:#181D1A; --surface-2:#212823; --fg:#E5EBE6; --muted:#97A39B; --line:#2B3430;
  --accent:#74C69D; --accent-fg:#0D1A13; --accent-soft:#1E3228;
  --pa:#8EA3FF; --pa-soft:#222A4A; --pb:#F0A45A; --pb-soft:#3A2918;
  --danger:#FF8F84; --danger-soft:#3B1D1A; --late:#FF8F84;
  --lamp:#F2B04F; --lamp-soft:#3A2C14; --cool:#6CB4E4; --cool-soft:#152A38; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#101412; --surface:#181D1A; --surface-2:#212823; --fg:#E5EBE6; --muted:#97A39B; --line:#2B3430;
  --accent:#74C69D; --accent-fg:#0D1A13; --accent-soft:#1E3228;
  --pa:#8EA3FF; --pa-soft:#222A4A; --pb:#F0A45A; --pb-soft:#3A2918;
  --danger:#FF8F84; --danger-soft:#3B1D1A; --late:#FF8F84;
  --lamp:#F2B04F; --lamp-soft:#3A2C14; --cool:#6CB4E4; --cool-soft:#152A38; color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--font-display);text-wrap:balance;margin:0;letter-spacing:-.01em}
h1{font-size:clamp(1.6rem,3.2vw,2.2rem);font-weight:700;line-height:1.15}
h2{font-size:1.08rem;font-weight:700}
h3{font-size:1rem;font-weight:700}
p{margin:0}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.app{display:grid;grid-template-columns:210px minmax(0,1fr);gap:32px;max-width:1240px;margin:0 auto}
.side{position:sticky;top:env(safe-area-inset-top,0px);align-self:start;height:calc(100vh - env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:24px;padding-block:24px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--font-display);font-weight:700;font-size:1.15rem}
.brand-mark{display:inline-flex;gap:0}
.brand-mark i{width:16px;height:16px;border-radius:50%;display:block}
.brand-mark i:first-child{background:var(--pa)}
.brand-mark i:last-child{background:var(--pb);margin-left:-6px;mix-blend-mode:multiply}
nav{display:flex;flex-direction:column;gap:2px}
nav a{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:var(--r-sm);color:var(--muted);text-decoration:none;font-weight:500}
nav a:hover{background:var(--surface-2);color:var(--fg)}
nav a[aria-current="page"]{background:var(--accent-soft);color:var(--fg)}
nav a[aria-current="page"] svg{color:var(--accent)}
nav svg{width:20px;height:20px;flex:none}
.sync{margin-top:auto;font-size:.8rem;color:var(--muted);display:flex;gap:8px;align-items:flex-start}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none;margin-top:6px}
.dot.ok{background:var(--accent)} .dot.warn{background:var(--pb)} .dot.err{background:var(--danger)}

.main{min-width:0;padding-block:28px 48px}
.mtop{display:none}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.eyebrow{font-size:.75rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600;margin-bottom:4px}
.sub{color:var(--muted);max-width:60ch}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.card-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:12px}
.card-h a{font-size:.85rem;text-decoration:none;font-weight:500}
.count{font-variant-numeric:tabular-nums;color:var(--muted);font-size:.85rem}
.dash{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
.dash .wide{grid-column:1/-1}

.addform{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:18px}
.field{display:flex;flex-direction:column;gap:4px;flex:1 1 140px;min-width:0}
.field.grow{flex:3 1 240px}
.field label{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
input[type=text],input[type=number],input[type=date],input[type=time],select,textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:var(--r-sm);padding:9px 10px;min-height:40px}
input:focus,select:focus,textarea:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid transparent;border-radius:var(--r-sm);padding:9px 16px;min-height:40px;font-weight:600;cursor:pointer;background:var(--accent);color:var(--accent-fg);white-space:nowrap}
.btn:hover{filter:brightness(1.06)}
.btn svg{width:18px;height:18px;flex:none}
a.btn{text-decoration:none}
.btn.ghost{background:transparent;color:var(--fg);border-color:var(--line)}
.btn.ghost:hover{background:var(--surface-2)}
.btn.danger{background:var(--danger-soft);color:var(--danger)}
.btn.sm{min-height:32px;padding:5px 10px;font-size:.85rem}

.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px;align-items:center}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;cursor:pointer;font-size:.85rem;font-weight:500;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.chips .spacer{flex:1}
.toggle{display:inline-flex;gap:6px;align-items:center;font-size:.85rem;color:var(--muted);cursor:pointer}

.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:12px;padding:10px 4px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.row-title{overflow-wrap:anywhere}
.row.done .row-title{text-decoration:line-through;color:var(--muted)}
.meta{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center;font-size:.8rem;color:var(--muted)}
.late{color:var(--late);font-weight:600}
.chk{width:20px;height:20px;accent-color:var(--accent);flex:none;cursor:pointer}
.icon-btn{border:0;background:transparent;color:var(--muted);width:32px;height:32px;border-radius:var(--r-sm);cursor:pointer;font-size:1.2rem;line-height:1;flex:none}
.icon-btn:hover{background:var(--danger-soft);color:var(--danger)}
.amount{font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}

.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:1px 9px;font-size:.75rem;font-weight:600;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.p-a{background:var(--pa-soft);color:var(--pa)}
.p-b{background:var(--pb-soft);color:var(--pb)}
.p-both{background:var(--accent-soft);color:var(--accent)}
.ex{font-size:.68rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);border:1px dashed var(--line);border-radius:4px;padding:0 5px;margin-left:6px;vertical-align:2px}

.empty{color:var(--muted);padding:14px 4px;font-size:.92rem}
.group-h{font-size:.75rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600;margin:18px 0 2px}
.group-h:first-child{margin-top:0}

.balance{display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between}
.balance-big{font-family:var(--font-display);font-size:1.5rem;font-weight:700;line-height:1.2}
.balance-big .amount{font-weight:700}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;margin-block:16px}
.bars{display:flex;flex-direction:column;gap:9px}
.bar-row{display:grid;grid-template-columns:110px minmax(0,1fr) auto;gap:10px;align-items:center;font-size:.85rem}
.bar-track{height:8px;background:var(--surface-2);border-radius:4px;overflow:hidden}
.bar-fill{height:100%;background:var(--accent);border-radius:4px}
.split{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--surface-2);margin-block:10px 8px}
.split span:first-child{background:var(--pa)} .split span:last-child{background:var(--pb)}
.legend{display:flex;justify-content:space-between;font-size:.85rem;gap:10px;flex-wrap:wrap}
.month-nav{display:flex;align-items:center;gap:6px}
.month-nav strong{min-width:9ch;text-align:center;font-variant-numeric:tabular-nums;text-transform:capitalize}

.board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;align-items:start}
.col-h{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
.col{display:flex;flex-direction:column;gap:12px}
.proj{display:flex;flex-direction:column;gap:10px}
.proj-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.proj-top h3{overflow-wrap:anywhere}
.proj-top select{width:auto;min-height:32px;padding:4px 8px;font-size:.8rem}
.desc{color:var(--muted);font-size:.9rem;overflow-wrap:anywhere}
.prog{display:flex;align-items:center;gap:10px;font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums}
.prog .bar-track{flex:1}
details summary{cursor:pointer;font-weight:600;font-size:.88rem;color:var(--accent);list-style:none}
details summary::-webkit-details-marker{display:none}
details summary::before{content:"▸ ";display:inline-block;transition:transform .15s}
details[open] summary::before{content:"▾ "}
.steps .row{padding:6px 0}
.stepform{display:flex;gap:6px;margin-top:8px}
.stepform input{min-height:34px;padding:6px 9px}
.proj-foot{display:flex;justify-content:flex-end}
.col-empty{border:1px dashed var(--line);border-radius:var(--r);padding:16px;color:var(--muted);font-size:.88rem}

.day{display:grid;grid-template-columns:64px minmax(0,1fr);gap:14px;padding:12px 0;border-bottom:1px solid var(--line)}
.day:last-child{border-bottom:0}
.day-date{display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--surface-2);border-radius:var(--r-sm);padding:6px 4px;height:fit-content;text-align:center}
.day-date b{font-family:var(--font-display);font-size:1.4rem;line-height:1}
.day-date span{font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.day.today .day-date{background:var(--accent);color:var(--accent-fg)}
.day.today .day-date span{color:var(--accent-fg)}
.ev{display:flex;gap:10px;align-items:flex-start;padding:4px 0}
.ev-time{font-variant-numeric:tabular-nums;font-weight:600;min-width:46px;color:var(--muted);font-size:.88rem;padding-top:1px}
.past{margin-top:18px}

.shop-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.mini{display:flex;flex-wrap:wrap;gap:6px}
.mini span{background:var(--surface-2);border-radius:999px;padding:2px 10px;font-size:.85rem}

.week-h{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:4px 0 10px;flex-wrap:wrap}
.week-acts{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tnum{font-variant-numeric:tabular-nums}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;margin-bottom:22px}
.mday{display:flex;flex-direction:column;gap:6px;min-width:0}
.mday-h{display:flex;align-items:baseline;gap:6px;padding:2px 4px;font-size:.8rem;color:var(--muted)}
.mday-h b{font-family:var(--font-display);font-size:1.15rem;color:var(--fg)}
.mday.today .mday-h b,.mday.today .mday-h{color:var(--accent)}
.meal{display:flex;flex-direction:column;align-items:flex-start;gap:3px;text-align:left;min-height:84px;padding:8px 9px;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--surface);cursor:pointer;min-width:0;width:100%}
.meal:hover{border-color:var(--accent)}
.meal.empty-slot{background:transparent;border-style:dashed;color:var(--muted)}
.meal.sel{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.meal.is-past{opacity:.6}
.slot{font-size:.66rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}
.meal-t{font-weight:600;font-size:.88rem;line-height:1.3;overflow-wrap:anywhere}
.meal .pill{font-size:.68rem;padding:0 7px}
.rec-tag{font-size:.7rem;color:var(--accent);font-weight:600}
.editor{margin-bottom:22px;display:flex;flex-direction:column;gap:12px;border-color:var(--accent)}
.editor textarea{min-height:120px;resize:vertical;line-height:1.45}
.editor .cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.editor .acts{display:flex;flex-wrap:wrap;gap:8px}
.today-meals{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.today-meals div{background:var(--surface-2);border-radius:var(--r-sm);padding:10px 12px;min-width:0}
@media (max-width:900px){
  .week{grid-template-columns:minmax(0,1fr);gap:6px}
  .mday{display:grid;grid-template-columns:52px minmax(0,1fr) minmax(0,1fr);gap:6px;align-items:stretch}
  .mday-h{flex-direction:column;align-items:center;justify-content:center;gap:0;background:var(--surface-2);border-radius:var(--r-sm)}
  .mday.today .mday-h{background:var(--accent);color:var(--accent-fg)}
  .mday.today .mday-h b{color:var(--accent-fg)}
  .meal{min-height:64px}
  .editor .cols{grid-template-columns:minmax(0,1fr)}
}
a.chip{text-decoration:none}
.chip[aria-current="page"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.seg{margin-bottom:18px}
.rec-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,250px),1fr));gap:14px}
.rec-card{display:flex;flex-direction:column;gap:8px}
.rec-card .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto;padding-top:4px}
.rec-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.rec-top h3{overflow-wrap:anywhere;min-width:0}
.price{font-weight:700;font-variant-numeric:tabular-nums;color:var(--accent);white-space:nowrap;letter-spacing:.02em}
.price-off{color:var(--line)}
.tag{background:var(--surface-2);border-radius:4px;padding:0 6px;color:var(--fg)}
.ing-rows{display:flex;flex-direction:column;gap:6px}
.ing-row{display:grid;grid-template-columns:minmax(0,1fr) 90px 140px 32px;gap:6px;align-items:center}
.inglist{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;font-size:.9rem}
.inglist li{display:flex;justify-content:space-between;gap:10px;border-bottom:1px dotted var(--line);padding:4px 0}
.pre{white-space:pre-wrap;font-size:.9rem;overflow-wrap:anywhere}
.flabel{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;margin-bottom:6px}
.hint{font-size:.85rem;color:var(--muted)}
.ing-line{display:grid;grid-template-columns:minmax(0,1fr) 110px 150px 32px;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.ing-line:last-child{border-bottom:0}
.ing-line select{min-height:34px;padding:4px 8px;font-size:.85rem}
.ing-name{overflow-wrap:anywhere}
@media (max-width:560px){
  .ing-row{grid-template-columns:minmax(0,1fr) 76px 32px}
  .ing-row select{grid-column:1/3}
  .ing-line{grid-template-columns:minmax(0,1fr) minmax(0,1fr) 32px}
  .ing-line .ing-name{grid-column:1/-1}
}
.nav-short{display:none}
@media (max-width:760px){ nav a .nav-long{display:none} nav a .nav-short{display:inline} }
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:var(--r-sm);font-size:.9rem;z-index:50;max-width:calc(100% - 32px);box-shadow:0 6px 24px rgb(0 0 0 / .18)}
.notice{background:var(--pb-soft);color:var(--fg);border-radius:var(--r-sm);padding:10px 14px;font-size:.88rem;margin-bottom:16px}
.settings{display:flex;flex-direction:column;gap:16px;max-width:640px}

@media (max-width:860px){
  .board{grid-template-columns:minmax(0,1fr)}
  .two{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:760px){
  .app{grid-template-columns:minmax(0,1fr);gap:0}
  .side{position:fixed;left:0;right:0;bottom:0;top:auto;height:auto;z-index:20;padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));background:var(--surface);border-top:1px solid var(--line);gap:0}
  .side .brand,.side .sync,.side .switch-space{display:none}
  nav{flex-direction:row;justify-content:space-around}
  nav a{flex-direction:column;gap:2px;padding:6px 4px;font-size:.68rem;flex:1;text-align:center;min-width:0}
  nav a.nav-settings{display:none}
  .main{padding-block:12px calc(88px + env(safe-area-inset-bottom,0px))}
  .mtop{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
  .mtop a{display:inline-flex;align-items:center;gap:6px;color:var(--muted);text-decoration:none;font-size:.85rem}
  .mtop svg{width:20px;height:20px}
  .bar-row{grid-template-columns:86px minmax(0,1fr) auto}
}
/* ---------- space chooser ---------- */
.switch-space{font-size:.85rem;color:var(--muted);text-decoration:none;padding:8px 12px;border-radius:var(--r-sm);display:flex;gap:8px;align-items:center;margin-top:8px}
.switch-space:hover{background:var(--surface-2);color:var(--fg)}
.mtop-r{display:flex;align-items:center;gap:14px}
body[data-space="choix"] .side,body[data-space="choix"] .mtop{display:none}
body[data-space="choix"] .app{grid-template-columns:minmax(0,1fr)}
body[data-space="choix"] .main{padding-block:0}
.chooser{min-height:94vh;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:28px;max-width:940px;margin:0 auto;padding-block:40px}
.chooser-head{text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px}
.brand-mark.big{margin-bottom:10px}
.brand-mark.big i{width:30px;height:30px}
.brand-mark.big i:last-child{margin-left:-11px}
.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;width:100%}

<script>
(() => {
const COLS = ['tasks','shopping','expenses','events','projects','meals','recipes','ingredients','rooms','devices'];
const DEFAULT_CFG = { a:'Partenaire A', b:'Partenaire B' };
const state = { tasks:[], shopping:[], expenses:[], events:[], projects:[], meals:[], recipes:[], ingredients:[], rooms:[], devices:[], maisonCfg:{ steps:{} }, config:{...DEFAULT_CFG}, editMeal:null,
  recipeDraft:null, recipeQuery:'', ingQuery:'', shopFinish:false, shopPay:{ payer:null }, shopPaid:null,
  mode:'loading', taskWho:'all', showDone:false, month:null, openProj:new Set(), confirmDel:null };
let db = null;

/* ---------- helpers ---------- */
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2,'0');
const iso = d => d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today = () => iso(new Date());
const parse = s => { const [y,m,d] = String(s).split('-').map(Number); return new Date(y,(m||1)-1,d||1); };
const F = (o) => new Intl.DateTimeFormat('fr-FR', o);
const fmtDay = s => F({weekday:'short',day:'numeric',month:'short'}).format(parse(s));
const fmtLong = s => F({weekday:'long',day:'numeric',month:'long',year:'numeric'}).format(parse(s));
const fmtMonth = ym => F({month:'long',year:'numeric'}).format(parse(ym+'-01'));
const num = v => parseFloat(String(v ?? '').replace(',', '.')) || 0;
const money = n =>new Intl.NumberFormat('fr-FR',{style:'currency',currency:'EUR'}).format(n||0);
const dayDiff = s => Math.round((parse(s) - parse(today())) / 86400000);
function rel(s){
  const d = dayDiff(s);
  if (d === 0) return "Aujourd'hui";
  if (d === 1) return 'Demain';
  if (d === -1) return 'Hier · en retard';
  if (d < 0) return 'En retard · ' + fmtDay(s);
  return fmtDay(s);
}
function addPeriod(s, rec){
  const d = parse(s);
  if (rec === 'daily') d.setDate(d.getDate()+1);
  else if (rec === 'weekly') d.setDate(d.getDate()+7);
  else if (rec === 'monthly') d.setMonth(d.getMonth()+1);
  return iso(d);
}
const REC = { none:'Une fois', daily:'Chaque jour', weekly:'Chaque semaine', monthly:'Chaque mois' };
const SHOP_CATS = ['Fruits & légumes','Viandes & poissons','Frais','Épicerie','Surgelés','Boissons','Maison & hygiène','Autre'];
const EXP_CATS = ['Logement','Courses','Sorties & restos','Transport','Maison','Vacances','Santé','Autre'];
const STATUS = { idee:'Idées', encours:'En cours', fini:'Terminés' };
const who = k => k === 'a' ? state.config.a : k === 'b' ? state.config.b : 'Ensemble';
const pill = k => `<span class="pill p-${k==='a'||k==='b'?k:'both'}">${esc(who(k))}</span>`;
const exChip = x => x.example ? '<span class="ex">exemple</span>' : '';
const byDue = (x,y) => (x.due||'9999') < (y.due||'9999') ? -1 : (x.due||'9999') > (y.due||'9999') ? 1 : (x.createdAt||0)-(y.createdAt||0);
const byWhen = (x,y) => ((x.date||'')+(x.time||'99:99')).localeCompare((y.date||'')+(y.time||'99:99'));
const SUB = { recettes:'menus', ingredients:'menus', 'en-courses':'courses' };
const MROUTES = [['maison','Pièces & scènes','Pièces'],['maison-config','Configuration','Config']];
const SPACE_HOME = { foyer:'accueil', maison:'maison' };
const SPACE_KEY = 'foyer-a-deux-space';
const remembered = () => { try { return localStorage.getItem(SPACE_KEY) || ''; } catch { return ''; } };
const remember = v => { try { v ? localStorage.setItem(SPACE_KEY, v) : localStorage.removeItem(SPACE_KEY); } catch {} };
const route = () => {
  const r = location.hash.slice(1);
  if (r === 'choix' || ROUTES.some(x=>x[0]===r) || SUB[r] || MROUTES.some(x=>x[0]===r)) return r;
  return SPACE_HOME[remembered()] || 'choix'; // opening the site asks where to go, unless this device remembers
};
const spaceOf = r => r === 'choix' ? 'choix' : r === 'en-courses' ? 'shop' : r.startsWith('maison') ? 'maison' : 'foyer';
const UNITS = ['pièce','g','kg','ml','cl','L','c. à soupe','c. à café','gousse','botte','boîte','paquet','sachet','tranche','pincée'];
const numFmt = n => (Math.round(n*100)/100).toLocaleString('fr-FR');
const qtyStr = (q, u) => { const n = parseFloat(String(q??'').replace(',','.')); if (!(n > 0)) return u && u !== 'pièce' ? u : ''; return !u || u === 'pièce' ? numFmt(n) : numFmt(n) + ' ' + u; };
function sourcesQty(src){
  const by = {}; Object.values(src||{}).forEach(s => { const u = s.unit || 'pièce'; by[u] = (by[u]||0) + (parseFloat(String(s.qty??'').replace(',','.')) || 0); });
  return Object.entries(by).map(([u,n]) => n > 0 ? qtyStr(n,u) : '').filter(Boolean).join(' + ');
}
const shopQty = s => [sourcesQty(s.sources), s.qty].filter(Boolean).join(' + ');
const shopFor = s => [...new Set(Object.keys(s.sources||{}).map(k => (state.meals.find(m => m.id === k) || {}).title).filter(Boolean))];

const IC = {
  accueil:'<path d="M3 9.5 10 3.5l7 6V17H3z"/><path d="M8 17v-4h4v4"/>',
  taches:'<rect x="3.5" y="3.5" width="13" height="13" rx="3"/><path d="m7 10 2 2 4-4"/>',
  courses:'<path d="M4.5 7h11l-1 9.5h-9z"/><path d="M7.5 7a2.5 2.5 0 0 1 5 0"/>',
  budget:'<rect x="3" y="5.5" width="14" height="10" rx="2"/><path d="M3 9h14"/><path d="M12.5 12.5h2"/>',
  agenda:'<rect x="3" y="4.5" width="14" height="12.5" rx="2"/><path d="M3 8.5h14M7 2.5v4M13 2.5v4"/>',
  projets:'<rect x="3" y="3.5" width="5" height="13" rx="1.5"/><rect x="11" y="3.5" width="6" height="8" rx="1.5"/>',
  menus:'<path d="M3 10.5h14a7 7 0 0 1-14 0z"/><path d="M10 3.5v3M7 4.5v2M13 4.5v2"/>',
  maison:'<path d="M7.2 12.6A4.8 4.8 0 1 1 12.8 12.6V14.5H7.2z"/><path d="M8 17.2h4"/>',
  'maison-config':'<path d="M3 6h14M3 14h14"/><circle cx="7" cy="6" r="2"/><circle cx="13" cy="14" r="2"/>',
  reglages:'<path d="M3 6h14M3 14h14"/><circle cx="7" cy="6" r="2"/><circle cx="13" cy="14" r="2"/>'
};
const ROUTES = [['accueil',"Aujourd'hui",'Accueil'],['taches','Tâches'],['courses','Courses'],['menus','Menus'],['budget','Budget'],['agenda','Agenda'],['projets','Projets'],['reglages','Réglages']];
const icon = k => `<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${IC[k]}</svg>`;

/* ---------- storage ---------- */
const LS_KEY = 'foyer-a-deux-v1';
function loadLocal(){
  try { const d = JSON.parse(localStorage.getItem(LS_KEY) || 'null'); if (d) { COLS.forEach(c => state[c] = d[c] || []); state.config = {...DEFAULT_CFG, ...(d.config||{})}; state.maisonCfg = { steps:{}, ...(d.maisonCfg||{}) }; } } catch {}
}
function saveLocal(){
  try { const d = {config:state.config, maisonCfg:state.maisonCfg}; COLS.forEach(c => d[c] = state[c]); localStorage.setItem(LS_KEY, JSON.stringify(d)); } catch {}
}
// Outside claude.ai (e.g. GitHub Pages) a first visit starts from the bundled recipe and ingredient banks
async function loadSeed(){
  try {
    const r = await fetch('data/seed.json'); if (!r.ok) return;
    const s = await r.json();
    ['recipes', 'ingredients'].forEach(c => { if (!state[c].length && Array.isArray(s[c])) state[c] = s[c]; });
    saveLocal();
  } catch {}
}
const uid = () =>Date.now().toString(36) + Math.random().toString(36).slice(2,8);
const chains = {};
function queued(key, fn){ chains[key] = (chains[key] || Promise.resolve()).then(fn).catch(fail); return chains[key]; }
function fail(e){
  const c = e && e.code;
  toast(c === 'invalid_argument' ? "Vous n'avez pas le droit de modifier ces données. Demandez un accès Contributeur."
    : c === 'quota_exceeded' ? "L'espace de stockage est plein. Supprimez d'anciens éléments."
    : c === 'resource_exhausted' ? 'Trop de modifications à la fois. Réessayez dans un instant.'
    : "L'enregistrement a échoué. Vérifiez la connexion et réessayez.");
}
async function addDoc(col, data){
  data.createdAt = Date.now();
  if (db) { try { await db.collection(col).add(data); } catch(e){ fail(e); } }
  else { state[col].push({ id:uid(), ...data }); saveLocal(); render(); }
}
function updDoc(col, id, patch){
  if (db) return queued(col+'/'+id, () => db.collection(col).doc(id).update(patch));
  const it = state[col].find(x => x.id === id); if (it) Object.assign(it, patch); saveLocal(); render();
}
function delDoc(col, id){
  if (db) return queued(col+'/'+id, () => db.collection(col).doc(id).delete());
  state[col] = state[col].filter(x => x.id !== id); saveLocal(); render();
}
function setDoc(col, id, data){
  if (db) return queued(col+'/'+id, () => db.collection(col).doc(id).set(data));
  state[col] = state[col].filter(x => x.id !== id).concat({ ...data, id }); saveLocal(); render();
}
function setMaisonCfg(cfg){
  state.maisonCfg = cfg;
  if (db) queued('config/maison', () => db.doc('config/maison').set(cfg)); else saveLocal();
  render();
}
async function setConfig(cfg){
  if (db) { try { await db.doc('config/couple').set(cfg); toast('Prénoms enregistrés'); } catch(e){ fail(e); } }
  else { state.config = cfg; saveLocal(); render(); toast('Prénoms enregistrés'); }
}

/* ---------- toast ---------- */
let toastT;
function toast(msg){ const t = document.getElementById('toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 3200); }

/* ---------- views ---------- */
function taskRow(t){
  const late = t.due && !t.done && dayDiff(t.due) < 0;
  return `<li class="row ${t.done?'done':''}">
    <input type="checkbox" class="chk" data-act="task" data-id="${t.id}" ${t.done?'checked':''} aria-label="Terminer : ${esc(t.title)}">
    <div class="row-main"><span class="row-title">${esc(t.title)}${exChip(t)}</span>
      <span class="meta">${pill(t.who)}${t.due?`<span class="${late?'late':''}">${rel(t.due)}</span>`:''}${t.rec&&t.rec!=='none'?`<span>↻ ${REC[t.rec]}</span>`:''}</span></div>
    <button class="icon-btn" data-act="del" data-col="tasks" data-id="${t.id}" aria-label="Supprimer la tâche">×</button></li>`;
}
function balance(){
  let netA = 0;
  for (const e of state.expenses){
    const amt = +e.amount || 0;
    const shareA = e.split === 'a' ? amt : e.split === 'b' ? 0 : amt/2;
    netA += (e.payer === 'a' ? amt : 0) - shareA;
  }
  return Math.round(netA*100)/100;
}
function balanceText(n){
  if (Math.abs(n) < 0.01) return { txt:'Vous êtes à l’équilibre.', even:true };
  const [debtor, creditor] = n > 0 ? ['b','a'] : ['a','b'];
  return { txt:`${esc(who(debtor))} doit <span class="amount">${money(Math.abs(n))}</span> à ${esc(who(creditor))}`, debtor, creditor, amt:Math.abs(n) };
}

    <div class="field"><label for="f-exp-payer">Payé par</label><select id="f-exp-payer" name="payer"><option value="a">${esc(state.config.a)}</option><option value="b">${esc(state.config.b)}</option></select></div>
    <div class="field"><label for="f-exp-split">Pour qui</label><select id="f-exp-split" name="split"><option value="both">Les deux (50/50)</option><option value="a">${esc(state.config.a)} seul·e</option><option value="b">${esc(state.config.b)} seul·e</option></select></div>
    <div class="field"><label for="f-exp-cat">Catégorie</label><select id="f-exp-cat" name="cat">${EXP_CATS.map(c=>`<option>${c}</option>`).join('')}</select></div>
    <div class="field"><label for="f-exp-date">Date</label><input id="f-exp-date" name="date" type="date" value="${today()}" required></div>

  <div class="head" style="margin-bottom:0"><h2>Mois</h2>

  <div class="two">

      ${catRows.length ? `<div class="bars">${catRows.map(([c,v])=>`<div class="bar-row"><span>${esc(c)}</span><div class="bar-track"><div class="bar-fill" style="width:${Math.max(3,v/max*100)}%"></div></div><span class="amount">${money(v)}</span></div>`).join('')}</div>` : '<p class="empty">Aucune dépense ce mois-ci.</p>'}

  return `<article class="card proj">

    ${p.desc ? `<p class="desc">${esc(p.desc)}</p>` : ''}
    ${p.deadline || p.budget ? `<div class="meta">${p.deadline?`<span class="${p.status!=='fini'&&dayDiff(p.deadline)<0?'late':''}">Échéance : ${esc(fmtDay(p.deadline))}</span>`:''}${p.budget?`<span>Budget prévu : <span class="amount">${money(+p.budget)}</span></span>`:''}</div>` : ''}

    <details data-pid="${p.id}" ${open?'open':''}><summary>Étapes</summary>
      <ul class="list steps">${s.map(x => `<li class="row ${x.done?'done':''}"><input type="checkbox" class="chk" data-act="step" data-id="${p.id}" data-step="${x.id}" ${x.done?'checked':''} aria-label="Étape faite : ${esc(x.text)}">

/* Shopping sync: each bank ingredient has one shopping line ("ing-<id>") whose
   `sources` maps the meals that need it to their quantity. Planning or removing
   a meal adds or removes only that meal's share. */
function syncShopping(changes){
  const out = new Map();
  const cur = id => out.has(id) ? out.get(id) : state.shopping.find(x => x.id === id);
  const keys = new Set(changes.map(c => c.key));
  state.shopping.forEach(s => {
    if (!s.sources || !Object.keys(s.sources).some(k => keys.has(k))) return;
    const src = { ...s.sources }; keys.forEach(k => delete src[k]); out.set(s.id, { ...s, sources:src });
  });
  let added = 0;
  changes.forEach(c => {
    if (!c.recipe || (!c.force && c.date < today())) return;
    (c.recipe.items || []).forEach(it => {
      if (!it.ingId) return;
      const ing = ingById(it.ingId); const id = 'ing-' + it.ingId; const ex = cur(id);
      const base = ex && !ex.done ? ex : { name:ing ? ing.name : it.name, cat:ing ? (ing.cat||'Autre') : 'Autre', qty:'', ingId:it.ingId, createdAt:ex ? ex.createdAt : Date.now(), sources:{} };
      out.set(id, { ...base, done:false, sources:{ ...(base.sources||{}), [c.key]:{ qty:it.qty||'', unit:it.unit||'' } } });
      added++;
    });
  });
  out.forEach((d, id) => {
    const { id:_omit, ...data } = d;
    if (data.ingId && !Object.keys(data.sources||{}).length && !data.qty) delDoc('shopping', id);
    else setDoc('shopping', id, data);
  });
  return added;
}

/* ---------- random week generator ----------
   Picks main-course recipes for the open slots so the week's average price
   (planned meals included) lands on €€: choose how many €, €€ and €€€ meals
   are needed, then draw recipes of each price without repeating one. */
// generated slots: dinner Monday to Friday, lunch and dinner on Saturday and Sunday (day index 0 = Monday)
const isAutoSlot = (i, s) => i >= 5 || s === 'soir';
const autoCount = days => { let filled = 0, open = 0; days.forEach((d, i) => SLOTS.forEach(([s]) => { if (isAutoSlot(i, s)) mealOf(d, s) ? filled++ : open++; })); return { filled, open }; };
const recipeOf = m => m && m.recipeId ? state.recipes.find(r => r.id === m.recipeId) : null;
function weekAvg(days){
  const ps = []; days.forEach(d => SLOTS.forEach(([s]) => { const r = recipeOf(mealOf(d, s)); if (r && r.price) ps.push(+r.price); }));
  return ps.length ? ps.reduce((a,b) => a+b, 0) / ps.length : 0;
}
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
// Meals that share one recipe when generated: Monday alone, Tuesday = Wednesday, Thursday = Friday
// (dinners), then each weekend meal on its own. Entries are [day index, slot].
const GEN_GROUPS = [[[0,'soir']], [[1,'soir'],[2,'soir']], [[3,'soir'],[4,'soir']], [[5,'midi']], [[5,'soir']], [[6,'midi']], [[6,'soir']]];
// Meat and fish families, read from a recipe's ingredients (bank ids first, then the ingredient's name)
const PROTEIN_IDS = { 'boeuf-hache':['bœuf'], 'boeuf-braiser':['bœuf'], 'steak-hache':['bœuf'], veau:['veau'],
  lardons:['porc'], jambon:['porc'], saucisse:['porc'], chorizo:['porc'], merguez:['agneau'],
  poulet:['volaille'], 'poulet-entier':['volaille'], 'cuisse-poulet':['volaille'], 'pilons-poulet':['volaille'], dinde:['volaille'], magret:['canard'],
  saumon:['poisson'], 'saumon-fume':['poisson'], cabillaud:['poisson'], thon:['poisson'], crevettes:['fruits de mer'], moules:['fruits de mer'] };
const PROTEIN_WORDS = [[/poulet|dinde|volaille|pintade/i, 'volaille'], [/\bb(œ|oe)uf|steak/i, 'bœuf'], [/\bveau\b/i, 'veau'],
  [/porc|jambon|lardon|saucisse|chorizo|bacon|rôti de porc/i, 'porc'], [/agneau|mouton|merguez/i, 'agneau'], [/canard|magret/i, 'canard'],
  [/saumon|cabillaud|thon|poisson|colin|truite|merlu|sardine|maquereau|lieu|dorade|bar\b/i, 'poisson'], [/crevette|moule|calamar|saint-jacques|gambas/i, 'fruits de mer']];
function proteinsOf(r){
  const out = new Set();
  ((r && r.items) || []).forEach(it => {
    const known = PROTEIN_IDS[it.ingId];
    if (known) { known.forEach(x => out.add(x)); return; }
    const n = ingName(it); PROTEIN_WORDS.forEach(([re, fam]) => { if (re.test(n)) out.add(fam); });
  });
  return [...out];
}
function genWeek(off, replaceAll){
  const days = weekDays(off);
  const pool = state.recipes.filter(r => +r.price && !/dessert|petit-déjeuner/i.test(r.tags||''));
  if (pool.length < 3) { toast('Il faut au moins quelques recettes avec un prix dans la banque.'); return; }
  const open = new Set(); // slot keys this run will write
  const units = [];        // { slots, w } : one recipe to draw, worn by w meals
  const copies = [];       // { slot, recipe } : open half of a pair whose other half is already planned
  GEN_GROUPS.forEach(g => {
    const members = g.map(([i, s]) => ({ date:days[i], slot:s, m:mealOf(days[i], s) }));
    const free = replaceAll ? members : members.filter(x => !x.m);
    if (!free.length) return;
    const anchor = replaceAll ? null : members.map(x => recipeOf(x.m)).find(Boolean);
    free.forEach(x => open.add(mealKey(x.date, x.slot)));
    if (anchor) free.forEach(x => copies.push({ slot:x, recipe:anchor }));
    else units.push({ slots:free, w:free.length });
  });
  if (!open.size) { toast('Les dîners de la semaine et les repas du week-end sont déjà prévus.'); return; }
  // priced meals that stay as they are (manual weekday lunches included) count toward the €€ average
  let fixedSum = 0, fixedN = 0;
  days.forEach(d => SLOTS.forEach(([s]) => { if (open.has(mealKey(d, s))) return; const r = recipeOf(mealOf(d, s)); if (r && +r.price) { fixedSum += +r.price; fixedN++; } }));
  copies.forEach(c => { fixedSum += +c.recipe.price || 0; fixedN += c.recipe.price ? 1 : 0; });
  const W = units.reduce((a, u) => a + u.w, 0);
  const need = 2 * (fixedN + W) - fixedSum;
  const byP = { 1:[], 2:[], 3:[] }; pool.forEach(r => byP[r.price] && byP[r.price].push(r)); Object.values(byP).forEach(shuffle);
  // try every price combination for the units (at most 3^7) and keep one that hits the target exactly
  let best = [], bestGap = Infinity;
  const combo = new Array(units.length);
  (function walk(i, sum){
    if (i === units.length) {
      const counts = { 1:0, 2:0, 3:0 }; combo.forEach(p => counts[p]++);
      if ([1,2,3].some(p => counts[p] > Math.max(byP[p].length, 0))) return;
      const gap = Math.abs(sum - need);
      if (gap < bestGap) { bestGap = gap; best = [combo.slice()]; } else if (gap === bestGap) best.push(combo.slice());
      return;
    }
    for (const p of [1,2,3]) { combo[i] = p; walk(i + 1, sum + p * units[i].w); }
  })(0, 0);
  const prices = best.length ? best[Math.floor(Math.random() * best.length)] : units.map(() => 2);
  const used = new Set(); days.forEach(d => SLOTS.forEach(([s]) => { const m = mealOf(d, s); if (m && m.recipeId && !open.has(mealKey(d, s))) used.add(m.recipeId); }));
  copies.forEach(c => used.add(c.recipe.id));
  // weekday dinners (Mon / Tue-Wed / Thu-Fri) never share a meat or fish family; meatless dishes always fit
  const weekdayKeys = new Set(GEN_GROUPS.slice(0, 3).flat().map(([i, s]) => mealKey(days[i], s)));
  const taken = new Set();
  days.slice(0, 5).forEach(d => { const k = mealKey(d, 'soir'); if (open.has(k)) return; proteinsOf(recipeOf(mealOf(d, 'soir'))).forEach(x => taken.add(x)); });
  copies.forEach(c => { if (weekdayKeys.has(mealKey(c.slot.date, c.slot.slot))) proteinsOf(c.recipe).forEach(x => taken.add(x)); });
  const clashes = r => proteinsOf(r).some(x => taken.has(x));
  const pick = (p, weekday) => {
    const list = byP[p].length ? byP[p] : pool;
    const ok = r => !weekday || !clashes(r);
    const r = list.find(x => !used.has(x.id) && ok(x)) || pool.find(x => !used.has(x.id) && ok(x))
      || list.find(x => !used.has(x.id)) || list[Math.floor(Math.random() * list.length)];
    used.add(r.id); if (weekday) proteinsOf(r).forEach(x => taken.add(x));
    return r;
  };
  const writes = copies.map(c => ({ slot:c.slot, recipe:c.recipe }));
  units.forEach((u, i) => { const r = pick(prices[i], weekdayKeys.has(mealKey(u.slots[0].date, u.slots[0].slot))); u.slots.forEach(sl => writes.push({ slot:sl, recipe:r })); });
  const changes = writes.map(({ slot:sl, recipe:r }) => {
    const key = mealKey(sl.date, sl.slot); const prev = mealOf(sl.date, sl.slot) || {};
    setDoc('meals', key, { date:sl.date, slot:sl.slot, recipeId:r.id, title:r.title, cook:prev.cook||'', ingredients:'', steps:'', link:'', createdAt:prev.createdAt||Date.now() });
    return { key, recipe:r, date:sl.date, force:true };
  });
  syncShopping(changes);
  state.editMeal = null; state.confirmDel = null; render();
  toast(`${changes.length} repas générés · moyenne ${'€'.repeat(Math.round(weekAvg(days)) || 2)} · ingrédients ajoutés aux courses`);
}
function saveMeal(date, slot, d, keepOpen){
  const key = mealKey(date, slot); const prev = mealOf(date, slot) || {};
  const rec = d.recipeId ? state.recipes.find(r => r.id === d.recipeId) : null;
  if (!rec && !(d.title||'').trim()) { toast('Choisissez une recette ou indiquez le nom du plat.'); return; }
  const data = rec

let wake = null, wakeOk = false;
async function keepAwake(on){
  try {

    else if (!on && wake) { const w = wake; wake = null; await w.release(); }

}

const DTYPES = { light:'Lumière', switch:'Prise', clim:'Climatisation', sensor:'Capteur de température' };

    return updDoc('projects', p.id, { steps:[...(p.steps||[]), { id:uid(), text:d.text.trim(), done:false }] }); },
  meal(d, f){ saveMeal(f.dataset.date, f.dataset.slot, d, false); },
  ingredient(d){ const name = d.name.trim(); if (!name) return;

document.addEventListener('submit', e => {
  const f = e.target.closest('form[data-form]'); if (!f) return;
  e.preventDefault();
  const d = Object.fromEntries(new FormData(f));
  const kind = f.dataset.form;
  if (kind !== 'config' && kind !== 'meal' && kind !== 'recipe' && kind !== 'shoppay') { f.reset(); const first = f.querySelector('input[type=text]'); if (first) first.focus(); }
  FORMS[kind](d, f);

function draftSync(el){
  const dr = state.recipeDraft; if (!dr) return;
  if (el.dataset.row) { const it = dr.items.find(x => x.k === el.dataset.row); if (it) it[el.dataset.f] = el.value; return it; }
  if (el.name && el.name in dr) dr[el.name] = el.value;

document.addEventListener('input', e => {
  const el = e.target;
  if (el.id === 'f-rq') { state.recipeQuery = el.value; render(); return; }
  if (el.id === 'f-iq') { state.ingQuery = el.value; render(); return; }
  // payment split: keep the two shares adding up to the total
  if (['f-pay-total', 'f-pay-a', 'f-pay-b'].includes(el.id) && state.shopPay.payer === 'both') {
    const t = num(document.getElementById('f-pay-total').value), a = document.getElementById('f-pay-a'), b = document.getElementById('f-pay-b');
    if (a && b && t > 0) {
      if (el.id === 'f-pay-total') { a.value = (t / 2).toFixed(2); b.value = (t - +a.value).toFixed(2); }
      else if (el.id === 'f-pay-a' && el.value !== '') b.value = Math.max(0, t - num(a.value)).toFixed(2);
      else if (el.id === 'f-pay-b' && el.value !== '') a.value = Math.max(0, t - num(b.value)).toFixed(2);
    }
    return;
  }
  if (el.dataset.act === 'bri') { const v = el.previousElementSibling && el.previousElementSibling.querySelector('.bri-val'); if (v) v.textContent = el.value + ' %'; return; }

document.addEventListener('change', e => {
  const el = e.target, act = el.dataset.act, id = el.dataset.id;

    if (it && el.dataset.f === 'name') { const ing = ingByName(el.value); if (ing && ing.unit) { it.unit = ing.unit; const u = document.getElementById('f-r-u-' + it.k); if (u) u.value = ing.unit; } }

  }
  if (el.id === 'f-remember') { if (!el.checked) remember(''); return; }
  if (act === 'bri') { updDoc('devices', id, { bri:+el.value }); return; }
  if (act === 'ent') { updDoc('devices', id, { entity:el.value.trim() }); return; }
  if (act === 'mstep') { const steps = { ...(state.maisonCfg.steps || {}), [el.dataset.k]:el.checked }; setMaisonCfg({ ...state.maisonCfg, steps }); return; }
  if (act === 'meal-rec') {
    const f = el.closest('form');

let confirmT;
function askConfirm(key){ state.confirmDel = key; render(); clearTimeout(confirmT); confirmT = setTimeout(() => { state.confirmDel = null; render(); }, 5000); }
document.addEventListener('click', e => {

      if (t > 0 && a && b && !a.value && !b.value) { a.value = (t / 2).toFixed(2); b.value = (t - +a.value).toFixed(2); } } }

  else if (act === 'gen-all') genWeek(+el.dataset.off, true);
  else if (act === 'rec-price') { state.recipePrice = +el.dataset.v; render(); }
  else if (act === 'rec-new') { state.recipeDraft = { id:null, title:'', tags:'', price:'0', steps:'', link:'', items:[newRow(), newRow(), newRow()] }; render(true);
    const t = document.getElementById('f-r-title'); if (t) { t.focus({ preventScroll:true }); document.getElementById('recipe-editor').scrollIntoView({ block:'start' }); } }
  else if (act === 'rec-edit') { e.preventDefault(); const r = state.recipes.find(x => x.id === id); if (!r) return;
    state.recipeDraft = { id:r.id, title:r.title||'', tags:r.tags||'', price:String(r.price||0), steps:r.steps||'', link:r.link||'',
      items:(r.items||[]).map(it => ({ k:uid(), name:ingName(it), qty:it.qty ?? '', unit:it.unit||'pièce' })).concat(newRow()) };
    state.editMeal = null;
    if (location.hash !== '#recettes') location.hash = 'recettes'; else render(true);
    requestAnimationFrame(() => { const ed = document.getElementById('recipe-editor'); if (ed) ed.scrollIntoView({ block:'start' }); }); }
  else if (act === 'rec-close') { state.recipeDraft = null; render(true); }
  else if (act === 'rec-addrow') { const row = newRow(); state.recipeDraft.items.push(row); render(true); const n = document.getElementById('f-r-n-' + row.k); if (n) n.focus(); }
  else if (act === 'rec-rmrow') { state.recipeDraft.items = state.recipeDraft.items.filter(x => x.k !== el.dataset.row); render(true); }
  else if (act === 'rec-del') { state.confirmDel = null; delDoc('recipes', id); toast('Recette supprimée'); }
  else if (act === 'ing-del') { state.confirmDel = null; delDoc('ingredients', id); }
  else if (act === 'meal-shop') { const m = state.meals.find(x => x.id === id); if (!m) return;
    const have = new Set(state.shopping.filter(s => !s.done).map(s => s.name.toLowerCase()));
    const lines = (m.ingredients||'').split('\n').map(s => s.replace(/^[-•*\s]+/, '').trim()).filter(s => s && !have.has(s.toLowerCase()));
    lines.forEach(name => addDoc('shopping', { name, qty:'', cat:'Autre', done:false }));
    toast(lines.length ? `${lines.length} ingrédient${lines.length>1?'s':''} ajouté${lines.length>1?'s':''} aux courses` : 'Ces ingrédients sont déjà dans la liste'); }
  else if (act === 'askexamples') askConfirm('examples');
  else if (act === 'delexamples') { state.confirmDel = null; COLS.forEach(c => state[c].filter(x => x.example).forEach(x => delDoc(c, x.id))); toast('Exemples supprimés'); }
});
document.addEventListener('toggle', e => {
  const d = e.target; if (!d.dataset || !d.dataset.pid) return;
  d.open ? state.openProj.add(d.dataset.pid) : state.openProj.delete(d.dataset.pid);
}, true);
window.addEventListener('hashchange', () => { state.confirmDel = null; render(); });

/* ---------- start ---------- */
render();
(async () => {
  let d = null;
  try { d = window.claude && window.claude.use ? await window.claude.use('db') : null; } catch {}
  if (!d) { state.mode = 'local'; loadLocal(); if (!state.recipes.length) await loadSeed(); render(); return; }
  db = d;
  const pending = new Set([...COLS, 'config', 'maison']);
  const timer = setTimeout(() => { if (pending.size && state.mode === 'loading') { state.mode = 'stale'; scheduleRender(); } }, 10000);
  const settle = (k, snap) => { if (!snap.metadata.fromCache && pending.delete(k) && !pending.size) { clearTimeout(timer); if (state.mode !== 'error') state.mode = 'shared'; } };
  const onErr = k => () => { pending.delete(k); clearTimeout(timer); state.mode = 'error'; scheduleRender(); };
  COLS.forEach(c => db.collection(c).onSnapshot(s => { state[c] = s.docs.map(x => ({ ...x.data(), id:x.id })); settle(c, s); scheduleRender(); }, onErr(c)));
  db.doc('config/couple').onSnapshot(s => { if (s.exists) state.config = { ...DEFAULT_CFG, ...s.data() }; settle('config', s); scheduleRender(); }, onErr('config'));
  db.doc('config/maison').onSnapshot(s => { if (s.exists) state.maisonCfg = { steps:{}, ...s.data() }; settle('maison', s); scheduleRender(); }, onErr('maison'));
})();
})();
</script>
